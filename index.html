<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALEC Chemical Management System</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
}

header{
background:#003366;
color:white;
text-align:center;
padding:20px;
}

header img{
height:80px;
}

.container{
width:90%;
margin:auto;
padding:20px;
}

input{
width:100%;
padding:15px;
font-size:18px;
border-radius:8px;
border:1px solid #ccc;
}

#chemicalList{
margin-top:20px;
}

</style>



<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<header>

<img src="assets/images.jpg">

<h1>ALEC Chemical Management System</h1>

<p>MSDS • COSHH • Chemical Register</p>

</header>

<div class="container">

<input
type="text"
placeholder="Search Chemical">

<div id="chemicalList"></div>
<script src="data.js"></script>
<script>
const container = document.getElementById("chemicalList");

chemicals.forEach(chemical => {

let hazards = "";

chemical.hazard.forEach(h => {

if(h==="Corrosive")
hazards += "🧪 ";

if(h==="Health Hazard")
hazards += "☣️ ";

if(h==="Flammable")
hazards += "🔥 ";

if(h==="Toxic")
hazards += "☠️ ";

});

container.innerHTML += `
<div style="
background:white;
padding:20px;
margin-top:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,.2);
">

<h2>${chemical.name}</h2>

<p><b>Manufacturer:</b> ${chemical.manufacturer}</p>

<p><b>Type:</b> ${chemical.type}</p>

<p><b>Expiry:</b> ${chemical.expiry}</p>

<p><b>Hazards:</b> ${hazards}</p>

<div id="qrcode-${chemical.id}" style="margin-top:20px;"></div>



<a href="${chemical.sds}" target="_blank">
📄 Open SDS
</a>

<br><br>

<a href="${chemical.coshh}" target="_blank">
📋 Open COSHH
</a>

</div>
`;
new QRCode(document.getElementById(`qrcode-${chemical.id}`), {
  text: `${window.location.origin}/ALEC-MSDS-COSHH-Library/${chemical.sds}`,
  width: 150,
  height: 150
});
});
</script>

</div>



</body>
</html>
